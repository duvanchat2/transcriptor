name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m py_compile transcribir.py gen_subtitles_hf.py render_composite.py
